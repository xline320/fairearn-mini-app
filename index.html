<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>FairEarn</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag -->
  <script src="https://libtl.com/sdk.js"
          data-zone="11732184"
          data-sdk="show_11732184">
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
      padding-bottom: 80px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 18px;
      border-radius: 0 0 25px 25px;
    }

    .header h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .header p {
      opacity: .8;
      font-size: 14px;
    }

    .balance {
      margin: 18px;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      text-align: center;
    }

    .balance-title {
      font-size: 14px;
      color: #777;
    }

    .balance-amount {
      font-size: 34px;
      font-weight: bold;
      margin: 8px 0;
    }

    .currency {
      font-size: 18px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 18px;
    }

    .action {
      background: white;
      padding: 18px 10px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
      cursor: pointer;
    }

    .action-icon {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .section {
      margin: 20px 18px 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .task {
      background: white;
      margin: 10px 18px;
      padding: 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .task-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .task-icon {
      width: 42px;
      height: 42px;
      background: #eef2ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .task-title {
      font-weight: bold;
      font-size: 15px;
    }

    .task-reward {
      color: #16a34a;
      font-size: 13px;
      margin-top: 4px;
    }

    .task-btn {
      background: #111827;
      color: white;
      border: none;
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -3px 15px rgba(0,0,0,.08);
      z-index: 100;
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
      color: #777;
      cursor: pointer;
    }

    .nav-item span {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

    .nav-item.active {
      color: #111827;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <h2>FairEarn 💰</h2>
    <p>Complete tasks and earn rewards</p>
  </div>

  <!-- BALANCE -->
  <div class="balance">
    <div class="balance-title">Your Balance</div>

    <div class="balance-amount">
      <span id="balance">0.00</span>
      <span class="currency">৳</span>
    </div>

    <div class="balance-title">
      Minimum withdrawal: ৳50
    </div>
  </div>

  <!-- QUICK ACTIONS -->
  <div class="section">Quick Actions</div>

  <div class="actions">

    <div class="action" onclick="watchAd()">
      <div class="action-icon">🎬</div>
      <div>Watch Ad</div>
    </div>

    <div class="action" onclick="withdraw()">
      <div class="action-icon">💸</div>
      <div>Withdraw</div>
    </div>

    <div class="action" onclick="dailyBonus()">
      <div class="action-icon">🎁</div>
      <div>Daily Bonus</div>
    </div>

    <div class="action" onclick="referral()">
      <div class="action-icon">👥</div>
      <div>Referral</div>
    </div>

  </div>

  <!-- TASKS -->
  <div class="section">Available Tasks</div>

  <div id="tasks">
    <div class="loading">
      Loading tasks...
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">

    <div class="nav-item active" onclick="home()">
      <span>🏠</span>
      Home
    </div>

    <div class="nav-item" onclick="loadTasks()">
      <span>📋</span>
      Tasks
    </div>

    <div class="nav-item" onclick="withdraw()">
      <span>💰</span>
      Withdraw
    </div>

    <div class="nav-item" onclick="profile()">
      <span>👤</span>
      Profile
    </div>

  </div>

<script>

  /* =========================
     TELEGRAM
  ========================= */

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  /* =========================
     API
  ========================= */

  const API_URL =
    "https://fairearn-api.xline320.workers.dev";


  /* =========================
     USER
  ========================= */

  let telegramUser = null;

  if (tg.initDataUnsafe &&
      tg.initDataUnsafe.user) {

    telegramUser = tg.initDataUnsafe.user;

    console.log("Telegram User:", telegramUser);
  }


  /* =========================
     BALANCE
  ========================= */

  let balance =
    parseFloat(localStorage.getItem("fairearn_balance")) || 0;


  function updateBalance() {

    document.getElementById("balance").innerText =
      balance.toFixed(2);

    localStorage.setItem(
      "fairearn_balance",
      balance.toFixed(2)
    );
  }


  updateBalance();


  /* =========================
     LOAD TASKS
  ========================= */

  async function loadTasks() {

    const container =
      document.getElementById("tasks");

    container.innerHTML =
      '<div class="loading">Loading tasks...</div>';

    try {

      const response =
        await fetch(API_URL + "/api/tasks");

      const data =
        await response.json();

      if (!data.success ||
          !data.tasks ||
          data.tasks.length === 0) {

        container.innerHTML =
          '<div class="empty">No tasks available right now.</div>';

        return;
      }


      container.innerHTML = "";


      data.tasks.forEach(task => {

        const div =
          document.createElement("div");

        div.className = "task";

        div.innerHTML = `

          <div class="task-info">

            <div class="task-icon">
              📋
            </div>

            <div>

              <div class="task-title">
                ${escapeHTML(task.title || "Task")}
              </div>

              <div class="task-reward">
                Reward: ৳${Number(task.reward || 0).toFixed(2)}
              </div>

            </div>

          </div>

          <button
            class="task-btn"
            onclick="openTask(${task.id})">
            Start
          </button>

        `;

        container.appendChild(div);

      });

    } catch (error) {

      console.error(error);

      container.innerHTML =
        '<div class="empty">Unable to load tasks.</div>';
    }
  }


  /* =========================
     OPEN TASK
  ========================= */

  function openTask(id) {

    tg.showAlert(
      "Task ID: " + id +
      "\n\nTask verification will be connected to the backend next."
    );

  }


  /* =========================
     WATCH AD
  ========================= */

  async function watchAd() {

    try {

      if (typeof show_11732184 === "function") {

        await show_11732184();

        /*
          IMPORTANT:
          এখানে সরাসরি balance যোগ করা হচ্ছে না।
          Backend verification যুক্ত করার পর
          server থেকে reward দেওয়া হবে।
        */

        tg.showAlert(
          "Ad completed successfully."
        );

      } else {

        tg.showAlert(
          "Ad is not available right now."
        );

      }

    } catch (error) {

      console.error(error);

      tg.showAlert(
        "Ad could not be completed."
      );

    }

  }


  /* =========================
     DAILY BONUS
  ========================= */

  function dailyBonus() {

    tg.showAlert(
      "Daily Bonus system will be connected to the backend."
    );

  }


  /* =========================
     WITHDRAW
  ========================= */

  function withdraw() {

    if (balance < 50) {

      tg.showAlert(
        "Minimum withdrawal is ৳50."
      );

      return;
    }

    tg.showAlert(
      "Withdrawal system will be connected to the backend."
    );

  }


  /* =========================
     REFERRAL
  ========================= */

  function referral() {

    tg.showAlert(
      "Referral system will be connected to the backend."
    );

  }


  /* =========================
     PROFILE
  ========================= */

  function profile() {

    if (!telegramUser) {

      tg.showAlert(
        "Telegram user information not found."
      );

      return;
    }

    const name =
      telegramUser.first_name || "User";

    tg.showAlert(
      "Name: " + name +
      "\nUser ID: " + telegramUser.id
    );

  }


  /* =========================
     HOME
  ========================= */

  function home() {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  /* =========================
     SECURITY
  ========================= */

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  /* =========================
     START
  ========================= */

  loadTasks();

</script>

</body>
</html>
