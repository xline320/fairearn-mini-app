<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairEarn Bot ⭐</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src='//libtl.com/sdk.js' data-zone='11732184' data-sdk='show_11732184'></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f6fb; color: #182033; padding-bottom: 90px; }
    .header { background: linear-gradient(135deg, #7058ee, #4630c7); color: white; padding: 25px 18px 30px; border-radius: 0 0 28px 28px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 52px; height: 52px; border-radius: 16px; background: white; display: flex; align-items: center; justify-content: center; font-size: 27px; }
    .brand h1 { font-size: 21px; }
    .brand p { font-size: 12px; opacity: .8; margin-top: 4px; }
    .balance-box { margin-top: 20px; background: #ffffff22; padding: 18px; border-radius: 20px; }
    .balance-title { font-size: 12px; opacity: .8; }
    .balance { font-size: 31px; font-weight: bold; margin: 7px 0 14px; }
    .withdraw { width: 100%; border: 0; padding: 13px; border-radius: 13px; background: white; color: #4630c7; font-weight: bold; cursor: pointer; }
    .container { padding: 18px; }
    .title { font-size: 18px; font-weight: bold; margin: 5px 0 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: white; border-radius: 18px; padding: 17px; box-shadow: 0 5px 18px #00000008; cursor: pointer; }
    .icon { font-size: 24px; margin-bottom: 10px; }
    .card h3 { font-size: 15px; }
    .card p { color: #7c8494; font-size: 12px; margin-top: 5px; line-height: 1.4; }
    .ad-section { margin-top: 24px; }
    .ad-card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 5px 18px #00000008; }
    .ad-card h3 { font-size: 16px; margin-bottom: 7px; }
    .ad-card p { color: #7c8494; font-size: 12px; line-height: 1.5; margin-bottom: 14px; }
    .watch-ad { width: 100%; border: 0; border-radius: 13px; padding: 13px; background: #6654e8; color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
    .watch-ad:disabled { opacity: .6; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="logo">⭐</div>
      <div>
        <h1>FairEarn Bot</h1>
        <p>Earn • Invite • Reward</p>
      </div>
    </div>

    <div class="balance-box">
      <div class="balance-title">Available Balance</div>
      <div class="balance" id="balance">Loading...</div>
      <button class="withdraw" onclick="alert('Minimum withdraw ৳50')">💸 Withdraw</button>
    </div>
  </div>

  <div class="container">
    <div class="ad-section">
      <div class="title">📺 Watch & Earn</div>
      <div class="ad-card">
        <h3>🎁 Watch Ad & Earn</h3>
        <p id="adMessage">বিজ্ঞাপনটি সম্পূর্ণ দেখুন এবং Reward (৳0.05) পান।</p>
        <button class="watch-ad" id="watchAdButton" onclick="watchRewardAd()">▶️ Watch Ad</button>
      </div>
    </div>
  </div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

// আপনার আসল Worker API URL
const API = "https://fairearn-api.xline320.workers.dev";
let balance = 0;

// ডাটাবেস থেকে ব্যালেন্স লোড করার ফাংশন
async function loadUser() {
  const user = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe.user : null;
  
  // যদি টেলিগ্রামের বাইরে থেকে ওপেন করা হয় (টেস্টিং ইউজার)
  const telegramId = user ? String(user.id) : "123456789"; 

  try {
    const res = await fetch(`${API}/api/me?telegram_id=${telegramId}`);
    const data = await res.json();
    if (data.success && data.user) {
      balance = Number(data.user.balance || 0);
      document.getElementById("balance").innerText = "৳ " + balance.toFixed(2);
    } else {
      document.getElementById("balance").innerText = "৳ 0.00";
    }
  } catch (e) {
    console.error(e);
    document.getElementById("balance").innerText = "৳ 0.00";
  }
}

// এড দেখে ডাটাবেসে টাকা জমা করার ফাংশন
async function watchRewardAd() {
  const button = document.getElementById("watchAdButton");
  const message = document.getElementById("adMessage");
  const user = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe.user : null;
  const telegramId = user ? String(user.id) : "123456789";

  if (typeof show_11732184 !== 'function') {
    message.innerText = "⏳ Ad system লোড হচ্ছে, কিছুক্ষণ পর চেষ্টা করুন...";
    return;
  }

  button.disabled = true;
  button.innerText = "⏳ Loading Ad...";

  try {
    // এড দেখানো
    await show_11732184();
    const rewardAmount = 0.05;

    message.innerText = "💾 ডাটাবেসে ব্যালেন্স সেভ হচ্ছে...";

    // ডাটাবেসে রিওয়ার্ড পাঠাবে
    const res = await fetch(`${API}/api/add-reward`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ telegram_id: telegramId, reward: rewardAmount })
    });

    const data = await res.json();

    if (data.success) {
      balance += rewardAmount;
      document.getElementById("balance").innerText = "৳ " + balance.toFixed(2);
      message.innerText = "🎉 সফল! ব্যালেন্স ডাটাবেসে সেভ হয়েছে।";
      if (tg && tg.showAlert) tg.showAlert("🎉 আপনার ব্যালেন্সে ৳0.05 যুক্ত হয়েছে!");
    } else {
      message.innerText = "❌ ডাটাবেসে সেভ করা যায়নি! Worker Binding চেক করুন।";
    }

  } catch (error) {
    message.innerText = "❌ বিজ্ঞাপন দেখা সম্পূর্ণ হয়নি।";
  } finally {
    button.disabled = false;
    button.innerText = "▶️ Watch Ad";
  }
}

// পেজ লোড হওয়ার সাথে সাথেই ডাটাবেস থেকে ব্যালেন্স লোড হবে
loadUser();
</script>
</body>
</html>
